name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs.
          additional_permissions: |
            actions: read

          # Allow the delivery loop to run repository checks, create/update normal PRs,
          # and post the final source-issue completion notification without interactive approval.
          # Merge is intentionally not allowlisted.
          claude_args: >-
            --allowed-tools
            "Bash(npm:*)"
            "Bash(node:*)"
            "Bash(gh pr create:*)"
            "Bash(gh pr view:*)"
            "Bash(gh pr checks:*)"
            "Bash(gh pr edit:*)"
            "Bash(gh issue comment:*)"
